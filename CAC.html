<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Verdana, Arial, sans-serif; margin:0; line-height:1.6; }
  .container {
    display: flex;
    gap: 20px;
    padding: 20px;
  }
  .sidebar {
    flex: 1;
    background: #e8f5e9;
    padding: 15px;
  }
  .main {
    flex: 2;
    background: #fff;
    padding: 15px;
  }
  /* Responsive: single column below 600px */
  @media (max-width: 600px) {
    .container { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h3>Quick Facts</h3>
      <ul>
        <li>Kenya lost 5% forest cover in 10 years</li>
        <li>Global temp +1.1°C</li>
      </ul>
    </aside>
    <article class="main">
      <h1>Climate Action Kenya</h1>
      <p>We promote tree planting and clean energy to fight climate change. Join us in building a resilient future.</p>
    </article>
  </div>
</body>
</html>
